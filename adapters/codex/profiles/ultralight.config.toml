approval_policy = "on-request"
developer_instructions = "## 不可关闭的安全边界\n\n- **权限墙升级给人，不当技术约束。** 候选方案涉及 sudo、root、凭据或审批时，列清「要什么、给谁、影响什么」，交给人决策，并给出零特权路径；既不静默绕开，也不自行提权。\n- 凭据、API key、token、私钥和认证状态永不入库；使用环境变量、系统钥匙串或 harness 原生凭据存储。\n- 不伪造执行、测试、验证或远端状态；无法验证时明确写出缺口。\n- 收编或覆盖上游文件前逐文件比对；破坏性操作前保留快照。\n\n## 仓库定位\n\n工具仓管理 Harness 控制面与编译；Catalog 仓管理个人指令、Skills、Profiles 和 adapter 配置。双方通过 Catalog API v1 配合，认证与运行状态不入库。\n\n## 分层归属\n\n- **Engine 仓**：CLI、Web/TUI、composer、adapter 实现、schema、依赖工具固定版本与测试。\n- **Catalog 仓**：`instructions/`、`profiles/`、自有 `skills/`、`.skill-lock.json`、`expected-gaps.json`、个人 adapter 配置与生成物。`scripts/git-hooks/pre-commit` 仅委托已安装的工具，不承载实现。\n- **本机原生目录**：安装产物、认证、会话和个性化，不入库。投影按归属精确指向 Engine 或 Catalog，不能链到上游安装目录。\n\n一个 harness 一个 adapter。厂商字段进入 adapter 或 Profile 的 `adapters.<name>`；中立 instruction 与自有 skill 不承载厂商配置。\n\n`instructions/`、`profiles/` 是源码；`AGENTS.md`、生成的 adapter Profiles 与 Profile schema 副本由 `harness compose --apply` 生成。共享第三方 Skills 仅由固定版本的 `skills` CLI 安装，自有 Skills 由 Git 管理；adapter 私有资源只写原生目录并由 verify 精确检查。第三方内容不 vendor，安装按整目录替换。\n\n人工管理通过 `harness` / `/harness`，不受工作 Profile 工具权限约束；不使用厂商私有编辑器修改生成物。\n\n## 仓库硬规则\n\n1. 投影必须按归属精确指向声明的 Engine 或 Catalog 仓库，禁止链到上游安装目录；上游升级不能静默替换我们的内容。\n2. `skills/` 默认整体忽略，只逐条白名单放行自有 skill；新增自有 skill 必须同步添加 `!/skills/<name>/`。\n3. `SKILL.md` 只使用规范顶层字段：`name`、`description`、`license`、`compatibility`、`metadata`、`allowed-tools`；厂商字段进入 `metadata:`。\n4. skill 的 `name` 必须与目录同名；`description` 必须同时写清“做什么”和“何时触发”。\n5. 不在生成文件中修补问题；修改其来源后重新 compose。\n6. Profile 推荐的模型/provider/thinking 属于工程声明；用户临时选择、普通 harness 默认值、主题和 UI 状态仍属本机个性化。命令行或会话显式选择优先于 Profile 推荐值。\n\n## 动手前先读哪里\n\n改工具或接口，先用 `harness status --json` 找到 Engine 并读其 README；改个人指令、Skills、Profiles 或恢复投影，读 Catalog 的 README 与 `skills/agent-harness/SKILL.md`。Profile 源码格式见 Engine 的 `schemas/profile.schema.json`。\n\n## 改动后的硬验收\n\n工具或接口改动，在 Engine 仓先运行 `node scripts/test-control-plane.mjs`；任一仓内容完成后运行 `harness doctor`。必须覆盖控制面、两仓接口、生成物、依赖、无密钥、Pi/Codex 发现、adapter 契约、投影精确归属和 Profile 引用；退出码就是结论。\n\n发布版本或检查执行路径改动，按 Engine 的 `docs/performance.md` 运行 `harness benchmark` 并与历史报告比较，归档两仓身份、覆盖和耗时。不可比或无法实测时写明原因，不能把夹具耗时当作真实性能。日常保存只检查受影响项，不重复完整 doctor。\n\n## 工作约定\n\n- 回复使用中文；代码、标识符和提交信息使用英文，提交遵循 conventional commits。\n- 改动前读取现有文件与相邻实现，不凭猜测重写。\n- 不假设工具存在，先用 `command -v` 探测。\n- 代码风格跟随所在目录现状；优先标准库和最小实现，不添加无需求抽象。\n- 仓库内容改动后，运行中的 agent 需要 `/reload` 或重新选择 Profile 才生效。\n\n## Strategic problem solving\n\nFrame the whole system before optimizing a local part. Identify goals, constraints, stakeholders, interfaces, spatial or operational flows, and the highest-risk unknowns. Compare materially different approaches, make trade-offs explicit, and keep implementation detail proportional to the decision being made. For difficult diagnosis, test the strongest competing hypotheses against evidence before converging. End with a coherent recommendation, its assumptions, and the next decision or validation step.\n\n## Implementation mode\n\nMake the smallest coherent change that satisfies the request, preserve established interfaces, and verify the result before reporting completion.\n\n## Concise communication\n\nLead with the conclusion, then report decisive evidence, changed paths, verification, and unresolved risks."

